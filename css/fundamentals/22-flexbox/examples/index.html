<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Flexbox Examples</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="wrapper">
        <h1>Flexbox Examples</h1>

        <section>
            <h2>1. Basic Flexbox</h2>
            <div class="container1">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>

        <section>
            <h2>2. Column Direction</h2>
            <div class="container2">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>

        <section>
            <h2>3. Space Between</h2>
            <div class="container3">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>

        <section>
            <h2>4. Align Items</h2>
            <div class="container4">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>

        <section>
            <h2>5. Gap</h2>
            <div class="container5">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>

        <section>
            <h2>6. Wrap (Responsive Flexbox)</h2>
            <div class="container6">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>

        <section>
            <h2>7. Centering</h2>
            <div class="center-container">
                <div class="box">CENTER</div>
            </div>
        </section>

        <section>
            <h2>8. Navbar</h2>
            <div class="navbar">
                <div class="logo">LOGO</div>
                <div class="menu">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Contact</a>
                </div>
            </div>
        </section>

        <section>
            <h2>9. Flex Grow</h2>
            <div class="container9">
                <div class="box flex1">1</div>
                <div class="box flex1">2</div>
                <div class="box flex1">3</div>
                <div class="box flex1">4</div>
            </div>
        </section>

        <section>
            <h2>10. Align Self</h2>
            <div class="container10">
                <div class="box">1</div>
                <div class="box special">2</div>
                <div class="box">3</div>
            </div>
        </section>
    </div>
</body>

</html>
