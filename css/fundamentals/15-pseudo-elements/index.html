<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- 

        Pseudo-Elements = Keyword added after a selector that's used to style a specific part of an element.

            selector::pseudo-element
            h1::first-letter{
            
            }
            
     -->

    <h1>Hello World !</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Similique quas in nihil aspernatur. Odit ducimus excepturi amet delectus laudantium atque minus, ipsa possimus, unde eius facilis. Eius excepturi natus omnis.</p>

    <ul id="fruit">
        <li id="mango">Mango</li>
        <li id="orange">Orange</li>
        <li id="banana">Banana</li>
    </ul>

</body>
</html>
