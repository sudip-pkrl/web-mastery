<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Examples</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    
    <div class="wrapper">
      <h1>Grid Examples</h1>

      <!-- 1 Basic Grid -->

      <section>
        <h2>1. Basic Grid</h2>

        <div class="grid1">
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
        </div>
      </section>

      <!-- 2 Equal Columns -->

      <section>
        <h2>2. Equal Columns</h2>

        <div class="grid2">
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
        </div>
      </section>

      <!-- 3 Responsive Grid -->

      <section>
        <h2>3. Responsive Grid</h2>

        <div class="grid3">
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
          <div class="box">7</div>
          <div class="box">8</div>
        </div>
      </section>

      <!-- 4 Center -->

      <section>
        <h2>4. Center</h2>

        <div class="grid4">
          <div class="center-box">CENTER</div>
        </div>
      </section>

      <!-- 5 Layout -->

      <section>
        <h2>5. Website Layout</h2>

        <div class="grid5">
          <div class="box header">HEADER</div>

          <div class="box sidebar">SIDEBAR</div>

          <div class="box main">MAIN</div>

          <div class="box footer">FOOTER</div>
        </div>
      </section>
    </div>

  </body>
</html>
