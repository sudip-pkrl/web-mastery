<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Lucide CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Lucide Example</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">
    <div class="title">
      <i data-lucide="layout-dashboard"></i>
      Dashboard
    </div>

    <div class="subtitle">Lucide Icon Test UI</div>

    <div class="menu">
      <div class="menu-item">
        <i data-lucide="home"></i>
        Home
      </div>

      <div class="menu-item">
        <i data-lucide="user"></i>
        Profile
      </div>

      <div class="menu-item">
        <i data-lucide="settings"></i>
        Settings
      </div>

      <div class="menu-item">
        <i data-lucide="bell"></i>
        Notifications
      </div>

      <div class="menu-item">
        <i data-lucide="log-out"></i>
        Logout
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
